<!doctype html><html lang="zh"><meta charset="utf-8"><title>教室 · 每度观测批次</title><style>body{margin:0;background:#101722;color:#e5ecf5;font:15px system-ui}header{padding:14px 24px;border-bottom:1px solid #364152}h2{margin:0 0 8px}p{margin:6px 0;color:#b8c7da;font-size:13px}.controls{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:14px 24px;background:#1b2738}input[type=range]{width:35vw}button,select{background:#334961;color:white;border:0;padding:8px 14px;border-radius:5px}#status{font-variant-numeric:tabular-nums;color:#95dfcb}#view{height:calc(100vh - 210px);min-height:500px}#error{color:#ff978f}</style>
<header><h2>教室观测 · IMU 每 1° 分批建模</h2><p>使用实际相对航向分组，按每个雷达包的主机时刻关联 IMU；未记录到的角度不补点。分组间拼接采用“绕雷达 Z 轴、正向旋转、原点固定”的待验证假设。</p><p>左键旋转 · 滚轮缩放 · 右键平移。颜色表示参考坐标 Z；空洞表示没有表面支持。当前结果为诊断建模，外参与三面墙几何尚未验证。</p></header>
<div class="controls"><button id="play">逐度播放</button><input id="degree" type="range" step="1"><strong id="angle"></strong><select id="mode"><option value="cumulative">累计到此角度</option><option value="single">仅这一度</option></select><label><input id="surface" type="checkbox" checked>表面</label><label><input id="points" type="checkbox" checked>点云</label><span id="status"></span><span id="error"></span></div><div id="view"></div>
<script>__PLOTLY__</script><script>
const batches=__BATCHES__;const slider=document.getElementById('degree'),mode=document.getElementById('mode');slider.min=batches[0].degree;slider.max=batches.at(-1).degree;slider.value=slider.max;let timer=null;
const layout={template:'plotly_dark',paper_bgcolor:'#101722',plot_bgcolor:'#101722',font:{color:'#dbe6f4'},margin:{l:0,r:0,t:15,b:0},showlegend:false,uirevision:'camera',scene:{aspectmode:'data',xaxis:{title:{text:'X / m'}},yaxis:{title:{text:'Y / m'}},zaxis:{title:{text:'Z / m（参考坐标）'}},camera:{eye:{x:-1.3,y:-1.5,z:.9}}}};
function traces(){let p=[],v=[],f=[],returns=0;const degree=Number(slider.value);let selected=mode.value==='single'?batches.filter(b=>b.degree===degree):batches.filter(b=>b.degree<=degree);for(const b of selected){let offset=v.length;p.push(...b.p);v.push(...b.v);for(let face of b.f)f.push(face.map(i=>i+offset));returns+=b.returns;}const split=(a,i)=>a.map(v=>v[i]);const own=batches.find(b=>b.degree===degree);document.getElementById('angle').textContent=degree+'°';document.getElementById('status').textContent=`本度 ${own.returns.toLocaleString()} 条回波 · 显示 ${p.length.toLocaleString()} 点 / ${f.length.toLocaleString()} 面`;return [{type:'mesh3d',x:split(v,0),y:split(v,1),z:split(v,2),i:split(f,0),j:split(f,1),k:split(f,2),intensity:split(v,2),colorscale:'Viridis',showscale:false,visible:document.getElementById('surface').checked,lighting:{ambient:.7,diffuse:.7}},{type:'scatter3d',mode:'markers',x:split(p,0),y:split(p,1),z:split(p,2),marker:{size:1.3,color:split(p,2),colorscale:'Viridis',opacity:.65},visible:document.getElementById('points').checked}];}
let busy=false,pending=false;async function draw(){if(busy){pending=true;return;}busy=true;try{await Plotly.react('view',traces(),layout,{responsive:true,displaylogo:false});window.lastRenderedDegree=Number(slider.value);}catch(e){document.getElementById('error').textContent=e.message;}finally{busy=false;if(pending){pending=false;draw();}}}
for(let id of ['degree','mode','surface','points'])document.getElementById(id).addEventListener('input',draw);
document.getElementById('play').onclick=()=>{if(timer){clearInterval(timer);timer=null;document.getElementById('play').textContent='逐度播放';return;}slider.value=slider.min;draw();document.getElementById('play').textContent='暂停';timer=setInterval(()=>{if(busy)return;if(Number(slider.value)>=Number(slider.max)){clearInterval(timer);timer=null;document.getElementById('play').textContent='逐度播放';return;}slider.value=Number(slider.value)+1;draw();},800);};draw();
</script></html>
