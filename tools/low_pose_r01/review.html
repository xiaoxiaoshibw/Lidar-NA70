<!doctype html><html lang="zh"><meta charset="utf-8"><title>低姿态背景实验 r01</title>
<style>body{margin:0;background:#101923;color:#e6edf3;font:14px system-ui}header{padding:14px;background:#192532}select,input,button{padding:6px;margin:3px}#status{white-space:pre-wrap;color:#ffcf7a;max-height:150px;overflow:auto}#view{height:65vh}small{color:#a9b9c9}.row{padding:6px}</style>
<header><b>八段低姿态 · 背景扣除与身份审阅</b><br><small>灰：原始有效上下文；蓝：冻结背景后候选；橙：背景命中的近地 UNKNOWN。橙点可能是地板、家具或身体，不能叫纯人体。地面高度与跨录制坐标仍待核验。</small></header>
<div class="row"><select id="session"></select><button id="previous">上一帧</button><input id="frame" type="number" min="0" value="0"><button id="next">下一帧</button><button id="queue">下一待审窗</button>
<label><input type="checkbox" id="context" checked>灰上下文</label><label><input type="checkbox" id="frozen" checked>蓝候选</label><label><input type="checkbox" id="rescue" checked>橙 UNKNOWN</label></div>
<div class="row"><select id="identity"><option>PERSON</option><option>FURNITURE</option><option>FLOOR</option><option>UNKNOWN</option></select><input id="reviewer" placeholder="实际审核人姓名"><button id="export">导出本帧身份审阅</button><button id="clear">清空选点</button><small>拖动旋转，滚轮缩放；单击选点。只导出可见采样点，不传播成整簇或全帧标签。</small></div>
<div id="status"></div><div id="view"></div><script src="/vendor.js"></script>
<script>
const el=id=>document.getElementById(id),scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(55,1,.01,100),renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(devicePixelRatio);el('view').appendChild(renderer.domElement);
scene.add(new THREE.GridHelper(12,24,0x587086,0x273b4d));
const group=new THREE.Group();scene.add(group);let catalog,row,active=[],selected=new Set(),request=0,qi=-1,yaw=.4,pitch=.7,radius=6,target=new THREE.Vector3(2,0,.5);
function resize(){const box=el('view').getBoundingClientRect();renderer.setSize(box.width,box.height);camera.aspect=box.width/box.height;camera.updateProjectionMatrix();}window.addEventListener('resize',resize);resize();
function draw(){camera.position.set(target.x+radius*Math.cos(pitch)*Math.cos(yaw),target.y+radius*Math.cos(pitch)*Math.sin(yaw),target.z+radius*Math.sin(pitch));camera.up.set(0,0,1);camera.lookAt(target);renderer.render(scene,camera);}draw();
// Ground grid defaults to XZ; rotate into XY to match the source frame.
scene.children[0].rotation.x=Math.PI/2;
function layer(data,color,name){const positions=data.xyz.flat(),geometry=new THREE.BufferGeometry();geometry.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));const material=new THREE.PointsMaterial({color,size:.025,sizeAttenuation:true});const points=new THREE.Points(geometry,material);points.userData={name,ids:data.source_indices};group.add(points);active.push(points);}
function render(){while(group.children.length){const obj=group.children[0];group.remove(obj);obj.geometry.dispose();obj.material.dispose();}active=[];if(!row)return;
 if(el('context').checked)layer(row.context,0x627481,'context');if(el('frozen').checked)layer(row.frozen_points,0x49b7ff,'frozen');if(el('rescue').checked)layer(row.protected_unknown,0xffab41,'unknown');
 const pts=[],ids=[];for(const data of [row.context,row.frozen_points,row.protected_unknown])data.source_indices.forEach((id,i)=>{if(selected.has(id)&&!ids.includes(id)){ids.push(id);pts.push(data.xyz[i]);}});layer({xyz:pts,source_indices:ids},0xff467e,'selected');
 el('status').textContent=`${row.sid} / f${row.frame}\n配准数值门：${row.alignment_gate}；物理地面/场景身份：未审核；正式背景资格：未通过。\n有效域 ${row.domain}；近地点 ${row.low}；冻结后近地点 ${row.low_frozen}；新增近地 UNKNOWN ${row.rescued_unknown}；已选 ${selected.size} 点。\n人体保留率 / 家具污染率：缺逐点身份GT，均不可评分。`;draw();}
async function load(){const token=++request,sid=el('session').value,rec=catalog.sessions.find(s=>s.sid===sid);let fi=Math.max(0,Math.min(rec.evaluated_frames===rec.frames?rec.frames-1:rec.frames-1,Number(el('frame').value)||0));if(sid===catalog.reference)fi=Math.max(2,Math.min(rec.frames-1,2+3*Math.round((fi-2)/3)));el('frame').value=fi;selected.clear();row=null;render();const res=await fetch(`${sid}/${String(fi).padStart(4,'0')}.json`);if(!res.ok)throw Error(`frame HTTP ${res.status}`);const data=await res.json();if(token!==request)return;row=data;render();}
for(const id of ['context','frozen','rescue'])el(id).onchange=render;el('session').onchange=()=>{el('frame').value=0;load().catch(showError);};el('frame').onchange=()=>load().catch(showError);
el('previous').onclick=()=>{el('frame').value=Number(el('frame').value)-(el('session').value===catalog.reference?3:1);load().catch(showError);};el('next').onclick=()=>{el('frame').value=Number(el('frame').value)+(el('session').value===catalog.reference?3:1);load().catch(showError);};
el('queue').onclick=()=>{qi=(qi+1)%catalog.review_queue.length;const q=catalog.review_queue[qi];el('session').value=q.sid;el('frame').value=q.frame;load().catch(showError);};el('clear').onclick=()=>{selected.clear();render();};
el('export').onclick=()=>{if(!row||!selected.size||!el('reviewer').value.trim()){alert('请选点并填写实际审核人');return;}const event={schema:'low-pose-identity/1',sid:row.sid,frame:row.frame,source_sha256:row.source_sha256,source_indices:[...selected].sort((a,b)=>a-b),class_name:el('identity').value,reviewer:el('reviewer').value.trim(),provenance:'HUMAN_REVIEW',coverage:'DISPLAYED_POINTS_ONLY_PARTIAL',review_time:new Date().toISOString()};const url=URL.createObjectURL(new Blob([JSON.stringify(event,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=`${row.sid}_f${row.frame}_${event.class_name}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
let down=null,moved=false;renderer.domElement.onpointerdown=e=>{down=[e.clientX,e.clientY];moved=false;renderer.domElement.setPointerCapture(e.pointerId);};renderer.domElement.onpointermove=e=>{if(!down)return;const dx=e.clientX-down[0],dy=e.clientY-down[1];if(Math.abs(dx)+Math.abs(dy)>2)moved=true;yaw-=dx*.006;pitch=Math.max(-1.3,Math.min(1.4,pitch+dy*.006));down=[e.clientX,e.clientY];draw();};renderer.domElement.onpointerup=e=>{down=null;if(moved||!row)return;const box=renderer.domElement.getBoundingClientRect(),mouse=new THREE.Vector2(2*(e.clientX-box.left)/box.width-1,1-2*(e.clientY-box.top)/box.height),ray=new THREE.Raycaster();ray.params.Points.threshold=.035;ray.setFromCamera(mouse,camera);const hits=ray.intersectObjects(active);if(hits.length){const h=hits[0],id=h.object.userData.ids[h.index];if(selected.has(id))selected.delete(id);else selected.add(id);render();}};
renderer.domElement.onwheel=e=>{e.preventDefault();radius=Math.max(.5,Math.min(25,radius*Math.exp(e.deltaY*.001)));draw();};
function showError(e){el('status').textContent=String(e);}
Promise.all([fetch('manifest.json').then(r=>r.json()),fetch('metrics.json').then(r=>r.json())]).then(([m,d])=>{catalog={...m,sessions:d.sessions,review_queue:d.review_queue};for(const s of catalog.sessions){const o=document.createElement('option');o.value=s.sid;o.textContent=`${s.name} · ${s.frames}帧`;el('session').appendChild(o);}return load();}).catch(showError);
</script></html>
