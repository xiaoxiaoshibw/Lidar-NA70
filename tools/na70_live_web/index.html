<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NA70 实时点云</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0a111b;color:#e5edf4;font:14px system-ui}header{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:#111d2b;border-bottom:1px solid #263b4f}h1{font-size:19px;margin:0}small{color:#91a8bb}main{height:calc(100vh - 66px);position:relative}canvas{display:block;width:100%;height:100%}.panel{position:absolute;top:18px;left:18px;background:#101d2be8;border:1px solid #304457;border-radius:10px;padding:16px;line-height:1.9;min-width:220px}.good{color:#58dfac}.bad{color:#ff967c}button{background:#213a50;color:white;border:1px solid #42637a;border-radius:6px;padding:7px 12px;cursor:pointer}.hint{position:absolute;bottom:18px;left:18px;color:#a8bac8;background:#101d2bdd;padding:8px 12px;border-radius:6px}</style>
<script type="importmap">{"imports":{"three":"/three.module.js"}}</script></head><body><header><div><h1>NA70 实时点云</h1><small>传感器坐标系 · 滑动叠加</small></div><button id="reset">重置视角</button></header><main id="view"><div class="panel"><strong id="connection">等待雷达数据</strong><div id="stats">正在连接…</div><label for="stack">叠加帧数 </label><select id="stack"><option value="1">1 帧</option><option value="5">5 帧</option><option value="10" selected>10 帧</option><option value="20">20 帧</option><option value="30">30 帧</option></select><br><small>颜色表示反射强度<br>每帧连续 100 个包；约 10 帧/秒<br>叠加未做运动补偿，运动时会重影</small></div><div class="hint">左键旋转 · 右键平移 · 滚轮缩放</div></main>
<style>#stats{white-space:pre-line}select{background:#213a50;color:#fff;border:1px solid #42637a;border-radius:5px;padding:4px}</style><script type="module">
import * as THREE from 'three'; import {OrbitControls} from '/OrbitControls.js';
const container=document.querySelector('#view'), scene=new THREE.Scene(); scene.background=new THREE.Color(0x0a111b); const camera=new THREE.PerspectiveCamera(55,1,.1,1000); camera.up.set(0,0,1); camera.position.set(35,-45,35); const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); container.prepend(renderer.domElement); const controls=new OrbitControls(camera,renderer.domElement); controls.enableDamping=true; controls.target.set(0,0,0); const grid=new THREE.GridHelper(100,20,0x426275,0x243949); grid.rotation.x=Math.PI/2; scene.add(grid); scene.add(new THREE.AxesHelper(8)); const geometry=new THREE.BufferGeometry(); const material=new THREE.PointsMaterial({size:.16,vertexColors:true,sizeAttenuation:true}); const cloud=new THREE.Points(geometry,material); scene.add(cloud);
function resize(){const w=container.clientWidth,h=container.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h)} addEventListener('resize',resize);resize();document.querySelector('#reset').onclick=()=>{camera.position.set(35,-45,35);controls.target.set(0,0,0);controls.update()};function draw(){requestAnimationFrame(draw);controls.update();renderer.render(scene,camera)}draw();
async function refresh(){try{const count=Number(document.querySelector('#stack').value);const [statusRes,frameRes]=await Promise.all([fetch('/api/status'),fetch(`/api/frame?frames=${count}`)]);if(!statusRes.ok||!frameRes.ok)throw new Error('请求失败');const s=await statusRes.json(), values=new Float32Array(await frameRes.arrayBuffer());const positions=new Float32Array(values.length/4*3),colors=new Float32Array(positions.length);for(let i=0,j=0;i<values.length;i+=4,j+=3){positions[j]=values[i];positions[j+1]=values[i+1];positions[j+2]=values[i+2];let t=Math.min(1,values[i+3]/150);colors[j]=.15+.85*t;colors[j+1]=.55+.4*(1-t);colors[j+2]=1-.8*t}geometry.setAttribute('position',new THREE.BufferAttribute(positions,3));geometry.setAttribute('color',new THREE.BufferAttribute(colors,3));geometry.computeBoundingSphere();let live=s.age_seconds!==null&&s.age_seconds<2&&!s.error;const el=document.querySelector('#connection');el.textContent=s.error?'接收错误：'+s.error:live?'● 正在接收':'● 等待雷达数据（画面为最后数据）';el.className=live?'good':'bad';document.querySelector('#stats').textContent=`显示 ${Number(values.length/4).toLocaleString()} 点 · 缓存 ${Math.min(count,s.buffered_frames||0)} 帧\n最新帧 ${s.points.toLocaleString()} 点 · 已收 ${s.packets.toLocaleString()} 包`;}catch(e){document.querySelector('#connection').textContent='连接中断';document.querySelector('#connection').className='bad'}finally{setTimeout(refresh,200)}}refresh();
</script></body></html>
